services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seven
      POSTGRES_PASSWORD: seven_dev
      POSTGRES_DB: seven_tools
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seven_test
      POSTGRES_PASSWORD: seven_test
      POSTGRES_DB: seven_tools_test
    ports:
      - "5433:5432"

volumes:
  pgdata:
